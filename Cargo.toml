[workspace]
resolver = "2"
members = [
    "crates/diff",
    "crates/compare",
    "crates/cli",
    "crates/gui",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

[profile.release]
lto = true
codegen-units = 1
