name: Release macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      arch:
        description: "macOS target architecture"
        required: true
        default: "aarch64"
        type: choice
        options:
          - aarch64
          - universal
          - x86_64

permissions:
  contents: write

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
      ARCH_TARGET: ${{ inputs.arch || 'aarch64' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.ARCH_TARGET == 'universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || env.ARCH_TARGET == 'x86_64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install desktop frontend dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Build macOS DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          chmod +x scripts/build-macos-dmg.sh
          scripts/build-macos-dmg.sh --arch "${ARCH_TARGET}"

      - name: Notarize & Staple macOS DMG (optional when Apple secrets configured)
        if: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG_FILE=$(ls dist/AutoCompare-*-macos-*.dmg | head -n 1)
          xcrun notarytool submit "${DMG_FILE}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${DMG_FILE}"
          spctl -a -t open --context context:primary-signature -v "${DMG_FILE}"
          (cd dist && shasum -a 256 "$(basename "${DMG_FILE}")" > "$(basename "${DMG_FILE}").sha256")

      - name: Upload DMG & SHA-256 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoCompare-macos-${{ env.ARCH_TARGET }}
          path: |
            dist/AutoCompare-*-macos-*.dmg
            dist/AutoCompare-*-macos-*.dmg.sha256
          if-no-files-found: error

      - name: Attach DMG to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AutoCompare-*-macos-*.dmg
            dist/AutoCompare-*-macos-*.dmg.sha256
          generate_release_notes: true
