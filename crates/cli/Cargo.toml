[package]
name = "autocompare-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line comparison: text, folders, bytes, merges"

[[bin]]
name = "autocompare"
path = "src/main.rs"

[lib]
name = "autocompare_cli"
path = "src/lib.rs"

[dependencies]
autocompare-diff = { path = "../diff" }
autocompare-compare = { path = "../compare" }
autocompare-reports = { path = "../reports" }
autocompare-server = { path = "../server" }
autocompare-sessions = { path = "../sessions" }
autocompare-telemetry = { path = "../telemetry" }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
