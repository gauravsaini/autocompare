[package]
name = "autocompare-vfs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Virtual filesystem abstraction: LocalFS, Zip, Tar.gz, and .bcss snapshots"

[lints]
workspace = true

[dependencies]
autocompare-evidence = { path = "../evidence" }
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.4"
