[package]
name = "autocompare-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local HTTP JSON-RPC server for AutoCompare web mode (autocompare web)"

[lints]
workspace = true

[dependencies]
autocompare-compare = { path = "../compare" }
autocompare-diff = { path = "../diff" }
autocompare-sessions = { path = "../sessions" }
autocompare-vfs = { path = "../vfs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
