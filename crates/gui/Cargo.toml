[package]
name = "autocompare-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop client over the autocompare engine"

[lib]
name = "autocompare_gui"
path = "src/lib.rs"

[[bin]]
name = "autocompare-gui"
path = "src/main.rs"

[dependencies]
autocompare-diff = { path = "../diff" }
autocompare-compare = { path = "../compare" }
eframe = "0.37.0"
egui_kittest = { version = "=0.37.0", features = ["eframe", "wgpu"] }
rfd = "0.18.0"

[lints]
workspace = true
